name: CI

on:
  push:
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - name: Instalar Python y dependencias
        run: uv sync --locked --all-groups
      - name: Ruff
        run: uv run ruff check .
      - name: Formato
        run: uv run ruff format --check .
      - name: Pruebas
        run: uv run pytest
